name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run tests
        run: python -m pytest -q

      # Notify the Telegram bot with the result (runs whether tests pass or fail).
      # Requires repo secrets TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID.
      - name: Notify Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATUS: ${{ job.status }}
          # Passed via env (not inlined into the script) so commit messages
          # can't inject shell. Falls back to the PR title on pull_request.
          COMMIT_MSG: ${{ github.event.head_commit.message || github.event.pull_request.title }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets not set; skipping notification."
            exit 0
          fi
          if [ "$STATUS" = "success" ]; then ICON="✅"; else ICON="❌"; fi
          SUBJECT="$(printf '%s' "$COMMIT_MSG" | head -n1)"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          TEXT="$(printf '%s CI %s\nRepo: %s\nBranch: %s\nCommit: %s — %s\nRun: %s' \
            "$ICON" "$STATUS" "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" \
            "${GITHUB_SHA:0:7}" "$SUBJECT" "$RUN_URL")"
          curl -sS -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${TEXT}" \
            --data-urlencode "disable_web_page_preview=true" > /dev/null
        # COMMIT_MSG is derived from the head commit's message (first line).
